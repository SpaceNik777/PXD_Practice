services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: teamboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Порт 5432 на хосте занят другим контейнером, поэтому пробрасываем на 55432.
      # Правая часть не меняется: внутри контейнера сервер слушает 5432.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teamboard"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
